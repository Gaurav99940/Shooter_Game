<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GALACTIC VOYAGER: ACE SHOOTER</title>
  <meta name="theme-color" content="#050512">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Impact', 'Arial Black', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050512;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.15);
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050512;
      display: block;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="480" height="800"></canvas>
  </div>

  <script>
    // ── EXACT SOUND ENGINE (WebAudio Synthesizer matching Pygame) ───────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playLaser() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    function playExplosion() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch(e) {}
    }

    function playPowerup() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch(e) {}
    }

    function playLevelUp() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch(e) {}
    }

    function playGameOver() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch(e) {}
    }

    // ── GAME CONSTANTS & STATE ─────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 480;
    const HEIGHT = 800;

    let state = "MENU"; // MENU, PLAYING, PAUSED, LEVEL_COMPLETED, GAME_OVER
    let score = 0;
    let wave = 1;
    let highScore = parseInt(localStorage.getItem('gv_highscore') || '37350');
    let screenShake = 0;
    let bannerText = "";
    let bannerColor = "#ffd23c";
    let bannerTimer = 0;

    // ── PARALLAX STARS & NEBULA (Exact match to Pygame) ────────────────────
    const stars = [];
    for (let i = 0; i < 40; i++) stars.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, speed: 0.5, r: 1, c: '#7878b4' });
    for (let i = 0; i < 35; i++) stars.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, speed: 1.1, r: 1, c: '#b4b4ff' });
    for (let i = 0; i < 20; i++) stars.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, speed: 2.2, r: 2, c: '#ffffff' });

    const nebulas = [
      { x: 100, y: 200, r: 90, c: 'rgba(30, 0, 60, 0.3)' },
      { x: 380, y: 450, r: 120, c: 'rgba(0, 20, 60, 0.3)' },
      { x: 200, y: 650, r: 80, c: 'rgba(0, 40, 30, 0.25)' }
    ];

    // ── PLAYER (Exact shape & drawing from player.py) ──────────────────────
    const player = {
      x: WIDTH / 2,
      y: HEIGHT - 90,
      w: 52,
      h: 52,
      speed: 300,
      lives: 3,
      lastShot: 0,
      fireDelay: 220,
      invFrames: 0,
      shield: false,
      triple: false,
      speedBoost: false,
      score2x: false,
      thrustT: 0,
      touchX: null
    };

    const powerupTimers = {};

    function applyPowerup(kind) {
      playPowerup();
      showBanner("? " + kind + " ?", "#ffd23c", 100);
      if (kind === "NOVA BOMB") {
        enemies.forEach(e => {
          createExplosion(e.x, e.y, 'enemy');
          score += e.score;
        });
        enemies.length = 0;
        divers.length = 0;
        showBanner("? NOVA BOMB! ?", "#ff8800", 120);
        return;
      }
      if (kind === "SHIELD") player.shield = true;
      if (kind === "TRIPLE SHOT") player.triple = true;
      if (kind === "SPEED BOOST") player.speedBoost = true;
      if (kind === "2X SCORE") player.score2x = true;
      powerupTimers[kind] = Date.now() + 8000;
    }

    function showBanner(text, color = "#ffd23c", duration = 90) {
      bannerText = text;
      bannerColor = color;
      bannerTimer = duration;
    }

    // ── ARRAYS ─────────────────────────────────────────────────────────────
    const enemies = [];
    const divers = [];
    let boss = null;
    const playerBullets = [];
    const enemyBullets = [];
    const explosions = [];
    const powerups = [];

    // ── UFO FORMATION (Exact match to enemy.py) ────────────────────────────
    let formationDir = 1;
    let formationSpeed = 1.0;

    function spawnFormation() {
      enemies.length = 0;
      divers.length = 0;
      boss = null;
      formationSpeed = 1.0 + (wave - 1) * 0.12;

      const rows = 4;
      const cols = 7;
      const xGap = 58;
      const yGap = 46;
      const startX = (WIDTH - (cols - 1) * xGap) / 2;

      for (let r = 0; r < rows; r++) {
        const y = 50 + r * yGap;
        const kind = (r + wave - 1) % 3;
        for (let c = 0; c < cols; c++) {
          const x = startX + c * xGap;
          // Exact colors from enemy.py
          let color = { r: 255, g: 210, b: 60 }; // Scout (Gold)
          let scoreVal = 50;
          let fireRate = 0.0015;
          if (kind === 1) { color = { r: 0, g: 220, b: 255 }; scoreVal = 100; fireRate = 0.0027; } // Raider (Cyan)
          if (kind === 2) { color = { r: 200, g: 80, b: 255 }; scoreVal = 150; fireRate = 0.0012; } // Stealth (Purple)

          enemies.push({
            x, y, w: 46, h: 22,
            kind, color, score: scoreVal,
            fireRate,
            visible: true
          });
        }
      }

      if (wave % 3 === 0) {
        spawnBoss();
      }
    }

    function spawnBoss() {
      boss = {
        x: WIDTH / 2,
        y: 80,
        w: 120,
        h: 60,
        hp: 20 + (wave - 3) * 5,
        maxHp: 20 + (wave - 3) * 5,
        speed: 80,
        dir: 1,
        lastFire: 0,
        fireDelay: 1200
      };
      showBanner("! BOSS INCOMING !", "#ff3333", 150);
      playGameOver();
    }

    function spawnDiver() {
      const x = 40 + Math.random() * (WIDTH - 80);
      const angle = Math.atan2(HEIGHT, player.x - x);
      divers.push({
        x, y: -20,
        w: 44, h: 20,
        vx: Math.cos(angle) * 220,
        vy: Math.sin(angle) * 220,
        score: 200,
        color: { r: 255, g: 140, b: 0 }
      });
    }

    // ── DRAWING HELPERS (Exact matching Pygame polygons & ellipses) ─────────
    function drawUFO(x, y, w, h, c, glow = true) {
      ctx.save();
      ctx.translate(x, y);

      // Outer glow
      if (glow) {
        ctx.shadowBlur = 12;
        ctx.shadowColor = `rgb(${c.r}, ${c.g}, ${c.b})`;
      }

      // 1. Saucer body
      ctx.fillStyle = `rgb(${c.r}, ${c.g}, ${c.b})`;
      ctx.beginPath();
      ctx.ellipse(0, 3, w / 2, h / 2.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Dome / Cockpit
      const domeR = Math.min(255, c.r + 60);
      const domeG = Math.min(255, c.g + 60);
      const domeB = Math.min(255, c.b + 60);
      ctx.fillStyle = `rgb(${domeR}, ${domeG}, ${domeB})`;
      ctx.beginPath();
      ctx.ellipse(0, -3, w / 4, h / 3.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // 3. Dark window
      ctx.fillStyle = 'rgba(20, 20, 40, 0.85)';
      ctx.beginPath();
      ctx.ellipse(0, -3, w / 6, h / 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 4. Center white light
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 5. Bottom 3 engine lights
      ctx.fillStyle = '#ffffc8';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(i * (w / 4), h / 2 - 3, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawPlayerShip(x, y, w, h) {
      ctx.save();
      ctx.translate(x, y);

      // Animated engine flame
      const flameH = 8 + Math.abs(Math.sin(player.thrustT)) * 7;
      ctx.fillStyle = 'rgba(255, 160, 20, 0.85)';
      ctx.beginPath();
      ctx.moveTo(-10, h / 2);
      ctx.lineTo(0, h / 2 + flameH);
      ctx.lineTo(10, h / 2);
      ctx.closePath();
      ctx.fill();

      // Main Hull (Darker Blue)
      ctx.fillStyle = 'rgb(20, 80, 220)';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00dcff';
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 + 2);               // nose
      ctx.lineTo(w / 2 - 4, h / 2 - 6);       // right wing
      ctx.lineTo(8, h / 2 - 2);                // right engine
      ctx.lineTo(0, h / 2 + 4);                // center bottom
      ctx.lineTo(-8, h / 2 - 2);               // left engine
      ctx.lineTo(-w / 2 + 4, h / 2 - 6);      // left wing
      ctx.closePath();
      ctx.fill();

      // Center Bright Highlight
      ctx.fillStyle = 'rgb(80, 160, 255)';
      ctx.beginPath();
      ctx.moveTo(0, -h / 2 + 2);
      ctx.lineTo(6, 0);
      ctx.lineTo(0, 4);
      ctx.lineTo(-6, 0);
      ctx.closePath();
      ctx.fill();

      // Cockpit Window
      ctx.fillStyle = 'rgb(160, 220, 255)';
      ctx.beginPath();
      ctx.ellipse(0, -h / 6, w / 6, h / 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wing Accent Lines (Cyan)
      ctx.strokeStyle = '#00dcff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-w / 2 + 10, h / 2 - 8);
      ctx.moveTo(0, 0);
      ctx.lineTo(w / 2 - 10, h / 2 - 8);
      ctx.stroke();

      // Shield Ring
      if (player.shield) {
        ctx.strokeStyle = '#00dcff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00dcff';
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function createExplosion(x, y, type = 'enemy') {
      const colors = type === 'enemy' ? ['#ffd23c', '#ff8c00', '#ff2800'] :
                     type === 'player' ? ['#50b4ff', '#00dcff', '#c8f0ff'] :
                     ['#ff1e1e', '#ff6400', '#ffd23c'];
      const particles = [];
      for (let i = 0; i < 14; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 180;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 2 + Math.random() * 3,
          life: 30
        });
      }
      explosions.push({ x, y, r: 6, life: 25, particles });
      playExplosion();
    }

    // ── CONTROLS ───────────────────────────────────────────────────────────
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      initAudio();
      if (state === "MENU" && (e.code === "Enter" || e.code === "Space")) {
        startGame();
      } else if (state === "GAME_OVER" && (e.code === "KeyR" || e.code === "Enter")) {
        resetGame();
        startGame();
      } else if (state === "LEVEL_COMPLETED" && (e.code === "Enter" || e.code === "Space")) {
        nextWave();
      } else if (e.code === "KeyP" || e.code === "Escape") {
        if (state === "PLAYING") state = "PAUSED";
        else if (state === "PAUSED") state = "PLAYING";
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function handlePointer(clientX, isDown) {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const scaleX = WIDTH / rect.width;
      const x = (clientX - rect.left) * scaleX;

      if (isDown) {
        if (state === "MENU") {
          startGame();
        } else if (state === "GAME_OVER") {
          resetGame();
          startGame();
        } else if (state === "LEVEL_COMPLETED") {
          nextWave();
        } else if (state === "PLAYING") {
          player.x = Math.max(player.w / 2, Math.min(WIDTH - player.w / 2, x));
        }
      }
    }

    canvas.addEventListener('pointerdown', e => {
      player.touchX = e.clientX;
      handlePointer(e.clientX, true);
    });
    canvas.addEventListener('pointermove', e => {
      if (e.buttons > 0 && state === "PLAYING") handlePointer(e.clientX, true);
    });
    canvas.addEventListener('pointerup', () => { player.touchX = null; });

    function startGame() {
      state = "PLAYING";
      wave = 1;
      score = 0;
      player.lives = 3;
      spawnFormation();
      playLevelUp();
    }

    function nextWave() {
      wave++;
      state = "PLAYING";
      spawnFormation();
      playLevelUp();
    }

    function resetGame() {
      enemies.length = 0;
      divers.length = 0;
      playerBullets.length = 0;
      enemyBullets.length = 0;
      explosions.length = 0;
      powerups.length = 0;
      boss = null;
      player.x = WIDTH / 2;
      player.y = HEIGHT - 90;
      player.shield = false;
      player.triple = false;
      player.speedBoost = false;
      player.score2x = false;
    }

    // ── GAME LOOP ──────────────────────────────────────────────────────────
    let lastTime = performance.now();

    function update(dt) {
      const now = Date.now();

      // Power-up countdowns
      for (const [k, exp] of Object.entries(powerupTimers)) {
        if (now >= exp) {
          if (k === "SHIELD") player.shield = false;
          if (k === "TRIPLE SHOT") player.triple = false;
          if (k === "SPEED BOOST") player.speedBoost = false;
          if (k === "2X SCORE") player.score2x = false;
          delete powerupTimers[k];
        }
      }

      // Parallax Stars
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > HEIGHT) { s.y = 0; s.x = Math.random() * WIDTH; }
      });

      if (state !== "PLAYING") return;

      // Player Movement
      const spd = player.speed * (player.speedBoost ? 1.5 : 1.0) * dt;
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= spd;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += spd;
      player.x = Math.max(player.w / 2, Math.min(WIDTH - player.w / 2, player.x));
      player.thrustT += dt * 8;
      if (player.invFrames > 0) player.invFrames--;

      // Shooting
      if (keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || player.touchX !== null) {
        if (now - player.lastShot >= player.fireDelay) {
          player.lastShot = now;
          playLaser();
          if (player.triple) {
            playerBullets.push({ x: player.x - 18, y: player.y - 20, vy: -700 });
            playerBullets.push({ x: player.x, y: player.y - 25, vy: -700 });
            playerBullets.push({ x: player.x + 18, y: player.y - 20, vy: -700 });
          } else {
            playerBullets.push({ x: player.x - 12, y: player.y - 20, vy: -700 });
            playerBullets.push({ x: player.x + 12, y: player.y - 20, vy: -700 });
          }
        }
      }

      // Formation UFO Movement
      if (enemies.length > 0) {
        let hitEdge = false;
        enemies.forEach(e => {
          if ((e.x > WIDTH - 25 && formationDir === 1) || (e.x < 25 && formationDir === -1)) {
            hitEdge = true;
          }
        });

        if (hitEdge) {
          formationDir *= -1;
          enemies.forEach(e => { e.y += 14; });
        }

        enemies.forEach(e => {
          e.x += formationSpeed * 60 * formationDir * dt;
          if (e.kind === 2) {
            e.visible = (Math.floor(now / 400) % 3 !== 0);
          }
          if (Math.random() < e.fireRate) {
            enemyBullets.push({ x: e.x, y: e.y + 12, vy: 280, color: '#ff5050' });
          }
        });

        if (Math.random() < 0.002) spawnDiver();
      }

      // Divers
      for (let i = divers.length - 1; i >= 0; i--) {
        const d = divers[i];
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        if (d.y > HEIGHT + 30) divers.splice(i, 1);
      }

      // Boss
      if (boss) {
        boss.x += boss.speed * boss.dir * dt;
        if (boss.x > WIDTH - boss.w / 2 - 10) boss.dir = -1;
        if (boss.x < boss.w / 2 + 10) boss.dir = 1;

        if (now - boss.lastFire >= boss.fireDelay) {
          boss.lastFire = now;
          enemyBullets.push({ x: boss.x - 30, y: boss.y + 20, vy: 300, color: '#ff8c00' });
          enemyBullets.push({ x: boss.x, y: boss.y + 25, vy: 300, color: '#ff8c00' });
          enemyBullets.push({ x: boss.x + 30, y: boss.y + 20, vy: 300, color: '#ff8c00' });
        }
      }

      // Bullets
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.y += b.vy * dt;
        if (b.y < -20) playerBullets.splice(i, 1);
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.y += b.vy * dt;
        if (b.y > HEIGHT + 20) enemyBullets.splice(i, 1);
      }

      // Powerups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += 140 * dt;
        if (p.y > HEIGHT + 20) powerups.splice(i, 1);
      }

      // Explosions
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.life--;
        ex.r += 1.2;
        ex.particles.forEach(p => {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life--;
        });
        if (ex.life <= 0) explosions.splice(i, 1);
      }

      // Collisions: Player Bullets -> Enemies
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        let hit = false;

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (!e.visible) continue;
          if (Math.abs(b.x - e.x) < e.w / 2 && Math.abs(b.y - e.y) < e.h / 2) {
            createExplosion(e.x, e.y, 'enemy');
            score += e.score * (player.score2x ? 2 : 1);
            if (Math.random() < 0.22) {
              const types = ["SHIELD", "TRIPLE SHOT", "SPEED BOOST", "NOVA BOMB", "2X SCORE"];
              powerups.push({ x: e.x, y: e.y, kind: types[Math.floor(Math.random() * types.length)] });
            }
            enemies.splice(j, 1);
            hit = true;
            break;
          }
        }

        if (!hit && boss) {
          if (Math.abs(b.x - boss.x) < boss.w / 2 && Math.abs(b.y - boss.y) < boss.h / 2) {
            boss.hp--;
            hit = true;
            createExplosion(b.x, b.y, 'boss');
            if (boss.hp <= 0) {
              score += 1000 * (player.score2x ? 2 : 1);
              showBanner("! BOSS DEFEATED! +1000 !", "#ffd23c", 120);
              boss = null;
            }
          }
        }

        if (hit) playerBullets.splice(i, 1);
      }

      // Collisions: Enemy Bullets -> Player
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (Math.abs(b.x - player.x) < player.w / 2 - 6 && Math.abs(b.y - player.y) < player.h / 2 - 6) {
          enemyBullets.splice(i, 1);
          if (player.invFrames <= 0) {
            if (player.shield) {
              player.shield = false;
              showBanner("SHIELD BROKEN!", "#00dcff", 60);
              playExplosion();
            } else {
              player.lives--;
              player.invFrames = 90;
              screenShake = 12;
              createExplosion(player.x, player.y, 'player');
              if (player.lives <= 0) {
                state = "GAME_OVER";
                playGameOver();
                if (score > highScore) {
                  highScore = score;
                  localStorage.setItem('gv_highscore', highScore);
                }
              }
            }
          }
        }
      }

      // Collisions: Powerups -> Player
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        if (Math.abs(p.x - player.x) < player.w / 2 + 10 && Math.abs(p.y - player.y) < player.h / 2 + 10) {
          applyPowerup(p.kind);
          powerups.splice(i, 1);
        }
      }

      // Win Condition
      if (enemies.length === 0 && divers.length === 0 && !boss && state === "PLAYING") {
        state = "LEVEL_COMPLETED";
        score += wave * 250;
        playLevelUp();
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('gv_highscore', highScore);
        }
      }

      if (screenShake > 0) screenShake *= 0.88;
      if (bannerTimer > 0) bannerTimer--;
    }

    // ── EXACT RENDER FUNCTION (1:1 with Pygame screenshot) ─────────────────
    function draw() {
      ctx.save();
      if (screenShake > 1) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Deep Space background
      ctx.fillStyle = '#050512';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Nebula clouds
      nebulas.forEach(nb => {
        ctx.fillStyle = nb.c;
        ctx.beginPath();
        ctx.arc(nb.x, nb.y, nb.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Stars
      stars.forEach(s => {
        ctx.fillStyle = s.c;
        ctx.fillRect(s.x, s.y, s.r, s.r);
      });

      // Power-up gems (pulsing green/cyan circle)
      powerups.forEach(p => {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#39ff14';
        ctx.fillStyle = '#39ff14';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      });

      // Player Glowing Laser Bullets
      ctx.fillStyle = '#00dcff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00dcff';
      playerBullets.forEach(b => {
        ctx.fillRect(b.x - 3, b.y - 8, 6, 16);
      });
      ctx.shadowBlur = 0;

      // Enemy Bullets (Glowing Red/Orange capsules)
      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = b.color;
        ctx.fillRect(b.x - 3, b.y - 6, 6, 12);
      });
      ctx.shadowBlur = 0;

      // Formation UFOs (Exact 3 types)
      enemies.forEach(e => {
        if (!e.visible) return;
        drawUFO(e.x, e.y, e.w, e.h, e.color);
      });

      // Diver UFOs (Orange)
      divers.forEach(d => {
        drawUFO(d.x, d.y, d.w, d.h, d.color);
      });

      // Boss UFO
      if (boss) {
        drawUFO(boss.x, boss.y, boss.w, boss.h, { r: 220, g: 40, b: 40 });
        // HP Bar
        ctx.fillStyle = '#440000';
        ctx.fillRect(boss.x - 50, boss.y + 35, 100, 6);
        ctx.fillStyle = '#ff2800';
        ctx.fillRect(boss.x - 50, boss.y + 35, (boss.hp / boss.maxHp) * 100, 6);
      }

      // Explosions
      explosions.forEach(ex => {
        ex.particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
      });

      // Player Ship
      if (state === "PLAYING" || state === "PAUSED") {
        if (player.invFrames === 0 || Math.floor(player.invFrames / 4) % 2 === 0) {
          drawPlayerShip(player.x, player.y, player.w, player.h);
        }
      }

      // ── HUD (Exact Match to Pygame Screenshot) ────────────────────────────
      // 1. WAVE 1 (Gold, Top-Left)
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px Impact, sans-serif';
      ctx.fillStyle = '#f0c828';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#f0c828';
      ctx.fillText(`*WAVE ${wave}`, 15, 30);

      // 2. SCORE (Neon Cyan Glow, Center)
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px Impact, sans-serif';
      ctx.fillStyle = '#00dcff';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00dcff';
      ctx.fillText(`SCORE ${score.toLocaleString()}`, WIDTH / 2, 34);

      // 3. BEST SCORE (Gray, Top-Right)
      ctx.textAlign = 'right';
      ctx.font = 'bold 18px Impact, sans-serif';
      ctx.fillStyle = '#787878';
      ctx.shadowBlur = 0;
      ctx.fillText(`BEST ${highScore.toLocaleString()}`, WIDTH - 15, 30);

      // 4. Lives (Blue Triangles on Bottom-Left)
      for (let i = 0; i < player.lives; i++) {
        const lx = 15 + i * 24;
        const ly = HEIGHT - 20;
        ctx.fillStyle = 'rgb(60, 140, 255)';
        ctx.beginPath();
        ctx.moveTo(lx + 8, ly - 14);
        ctx.lineTo(lx + 16, ly);
        ctx.lineTo(lx, ly);
        ctx.closePath();
        ctx.fill();
      }

      // 5. Active Power-up Timers (Bottom-Right, e.g. "SPE 6.7s" in Neon Green)
      let pX = WIDTH - 15;
      for (const [k, exp] of Object.entries(powerupTimers)) {
        const sec = Math.max(0, ((exp - Date.now()) / 1000)).toFixed(1);
        ctx.textAlign = 'right';
        ctx.font = 'bold 16px Impact, sans-serif';
        ctx.fillStyle = '#39ff14';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#39ff14';
        ctx.fillText(`${k.slice(0, 3)} ${sec}s`, pX, HEIGHT - 18);
        pX -= 75;
      }
      ctx.shadowBlur = 0;

      // 6. Center Banner (e.g. "? SPEED BOOST ?")
      if (bannerTimer > 0) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px Impact, sans-serif';
        ctx.fillStyle = bannerColor;
        ctx.shadowBlur = 15;
        ctx.shadowColor = bannerColor;
        ctx.fillText(bannerText, WIDTH / 2, HEIGHT / 2 - 40);
        ctx.shadowBlur = 0;
      }

      // ── OVERLAYS ───────────────────────────────────────────────────────────
      if (state === "MENU") {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.textAlign = 'center';

        ctx.font = 'bold 44px Impact, sans-serif';
        ctx.fillStyle = '#00dcff';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00dcff';
        ctx.fillText("GALACTIC VOYAGER", WIDTH / 2, HEIGHT / 2 - 120);

        ctx.font = 'bold 24px Impact, sans-serif';
        ctx.fillStyle = '#ffd23c';
        ctx.shadowColor = '#ffd23c';
        ctx.fillText("ACE SHOOTER", WIDTH / 2, HEIGHT / 2 - 75);
        ctx.shadowBlur = 0;

        ctx.font = 'bold 22px Impact, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText("TAP OR PRESS ENTER TO START", WIDTH / 2, HEIGHT / 2);

        ctx.font = '14px Arial, sans-serif';
        ctx.fillStyle = '#8888aa';
        ctx.fillText("Drag to Move  *  Tap to Shoot", WIDTH / 2, HEIGHT / 2 + 50);

        if (highScore > 0) {
          ctx.font = 'bold 18px Impact, sans-serif';
          ctx.fillStyle = '#ffd23c';
          ctx.fillText(`BEST SCORE: ${highScore.toLocaleString()}`, WIDTH / 2, HEIGHT / 2 + 110);
        }
      } else if (state === "GAME_OVER") {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.textAlign = 'center';

        ctx.font = 'bold 44px Impact, sans-serif';
        ctx.fillStyle = '#ff2222';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0000';
        ctx.fillText("MISSION FAILED", WIDTH / 2, HEIGHT / 2 - 80);
        ctx.shadowBlur = 0;

        ctx.font = 'bold 26px Impact, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`FINAL SCORE: ${score.toLocaleString()}`, WIDTH / 2, HEIGHT / 2 - 20);

        ctx.font = 'bold 20px Impact, sans-serif';
        ctx.fillStyle = '#ffd23c';
        ctx.fillText("TAP OR PRESS R TO RETRY", WIDTH / 2, HEIGHT / 2 + 40);
      } else if (state === "LEVEL_COMPLETED") {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.textAlign = 'center';

        ctx.font = 'bold 40px Impact, sans-serif';
        ctx.fillStyle = '#39ff14';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#39ff14';
        ctx.fillText("SECTOR CLEARED!", WIDTH / 2, HEIGHT / 2 - 80);
        ctx.shadowBlur = 0;

        ctx.font = 'bold 24px Impact, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`SCORE: ${score.toLocaleString()}`, WIDTH / 2, HEIGHT / 2 - 20);

        ctx.font = 'bold 20px Impact, sans-serif';
        ctx.fillStyle = '#00dcff';
        ctx.fillText(`WAVE BONUS: +${(wave * 250).toLocaleString()}`, WIDTH / 2, HEIGHT / 2 + 20);

        ctx.fillStyle = '#ffd23c';
        ctx.fillText("TAP OR PRESS ENTER FOR NEXT WAVE", WIDTH / 2, HEIGHT / 2 + 70);
      }

      ctx.restore();
    }

    function loop(now) {
      const current = typeof now === 'number' ? now : performance.now();
      const dt = Math.min(Math.max((current - lastTime) / 1000, 0.001), 0.1) || 0.016;
      lastTime = current;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    lastTime = performance.now();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
